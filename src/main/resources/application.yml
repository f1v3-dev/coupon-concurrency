spring:
  application:
    name: coupon

  datasource:
    url: jdbc:mysql://localhost:3306/coupon
    username: coupon_user
    password: coupon_password
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

  data:
    redis:
      host: localhost
      port: 6379
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
